<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenRoom • Live HD</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
body { background:#080a11; color:#f1f5f9; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

.topbar { height:56px; background:rgba(13,17,28,0.95); border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0; }
.status-pill { display:flex; align-items:center; gap:8px; font-size:0.8rem; background:rgba(255,255,255,0.05); padding:6px 14px; border-radius:20px; font-weight:700; }
.dot { width:8px; height:8px; border-radius:50%; background:#eab308; }
.dot.live { background:#22c55e; box-shadow:0 0 10px #22c55e; }

.stage { flex:1; display:flex; align-items:center; justify-content:center; background:#06080e; padding:12px; position:relative; overflow:hidden; }
video { width:100%; height:100%; max-height:calc(100vh - 130px); object-fit:contain; border-radius:14px; background:#000; box-shadow:0 20px 50px rgba(0,0,0,0.8); }
.stage:fullscreen video { max-height:100vh; width:100vw; border-radius:0; }

.audio-alert {
  position:absolute; top:20px; left:50%; transform:translateX(-50%);
  padding:10px 22px; border-radius:30px; font-weight:700; font-size:0.85rem;
  z-index:60; display:none; box-shadow:0 8px 25px rgba(0,0,0,0.6);
}
.audio-alert.green { background:#10b981; color:#fff; }
.audio-alert.red { background:#ef4444; color:#fff; cursor:pointer; }

.watch-overlay {
  position:absolute; inset:0; background:rgba(8,10,17,0.88); backdrop-filter:blur(10px);
  display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:50;
}
.btn-watch {
  background:linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; border:none;
  padding:18px 36px; border-radius:18px; font-size:1.15rem; font-weight:800; cursor:pointer;
  box-shadow:0 15px 35px rgba(99,102,241,0.5); display:flex; align-items:center; gap:12px;
  animation:pulseBtn 2s infinite; transition:transform 0.2s;
}
.btn-watch:hover { transform:scale(1.05); }
@keyframes pulseBtn { 0%,100%{box-shadow:0 15px 35px rgba(99,102,241,0.5);} 50%{box-shadow:0 20px 50px rgba(99,102,241,0.8);} }

.dock-bar { height:68px; background:#0d111c; border-top:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:space-between; padding:0 18px; flex-shrink:0; }
.dbtn { background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.1); padding:9px 16px; border-radius:12px; font-size:0.85rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; transition:0.2s; }
.dbtn:hover { background:rgba(255,255,255,0.15); transform:translateY(-1px); }
.dbtn.pri { background:linear-gradient(135deg,#6366f1,#4f46e5); border:none; }
.dbtn.danger { background:#ef4444; border:none; }
.dbtn.watch { background:#10b981; border:none; color:#fff; }

.vslider { -webkit-appearance:none; width:90px; height:5px; border-radius:5px; background:rgba(255,255,255,0.2); outline:none; cursor:pointer; }
.vslider::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#6366f1; cursor:pointer; }

.toast { position:fixed; bottom:85px; left:50%; transform:translateX(-50%); background:#1f2937; border:1px solid #6366f1; color:#fff; padding:10px 20px; border-radius:25px; font-size:0.85rem; opacity:0; transition:0.3s; pointer-events:none; z-index:100; }
.toast.show { opacity:1; }
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex; align-items:center; gap:10px;">
    <button class="dbtn" onclick="location.href='/'">←</button>
    <span id="roomTitle" style="font-weight:700;">Sala</span>
    <div class="status-pill">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Aguardando</span>
    </div>
  </div>
  <span style="font-size:0.85rem; color:#94a3b8;">👥 <span id="viewerCount">0</span> online</span>
</div>

<div class="stage" id="stageArea">
  <div class="audio-alert" id="audioAlert"></div>

  <div class="watch-overlay" id="watchOverlay">
    <div style="font-size:3rem;">🎮</div>
    <div style="font-size:1.3rem; font-weight:800; color:#fff;">Transmissão Ao Vivo</div>
    <p style="color:#94a3b8; font-size:0.9rem;">Clique no botão abaixo para assistir com imagem 60 FPS e som do jogo.</p>
    <button class="btn-watch" onclick="startWatching()">▶️ Assistir Transmissão</button>
  </div>

  <div id="emptyState" style="text-align:center; color:#94a3b8;">
    <div style="font-size:3.5rem;">🖥️</div>
    <h3 style="color:#fff; margin:6px 0;" id="emptyTitle">Aguardando Transmissão</h3>
    <p style="font-size:0.85rem;">O host ainda não iniciou a tela.</p>
  </div>
  <video id="screenVideo" autoplay playsinline style="display:none;" ondblclick="toggleFullscreen()"></video>
  <audio id="screenAudio" autoplay playsinline style="display:none;"></audio>
</div>

<div class="dock-bar">
  <div style="display:flex; gap:8px;">
    <button class="dbtn pri" id="btnStream" onclick="toggleStream()" style="display:none;">📡 Transmitir Tela</button>
    <button class="dbtn watch" id="btnDockWatch" onclick="startWatching()" style="display:none;">📺 Assistir</button>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <button class="dbtn" id="btnMute" onclick="toggleMute()">🔊 Som</button>
    <input type="range" class="vslider" id="volSlider" min="0" max="100" value="100" oninput="setVolume(this.value)">
    <button class="dbtn" onclick="toggleFullscreen()">⛶ Tela Cheia</button>
    <button class="dbtn" onclick="copyLink()">📋 Copiar Link</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const urlParams = new URLSearchParams(window.location.search);
const role = urlParams.get('role') || 'viewer';
const roomId = window.location.pathname.split('/room/')[1].split('?')[0];

document.getElementById('roomTitle').textContent = '#' + roomId;
const video = document.getElementById('screenVideo');
const audioEl = document.getElementById('screenAudio');
const emptyState = document.getElementById('emptyState');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const watchOverlay = document.getElementById('watchOverlay');
const btnDockWatch = document.getElementById('btnDockWatch');
const audioAlert = document.getElementById('audioAlert');

let localStream = null;
let peerConnections = {};
let viewerPC = null;
let viewerStream = null;
let iceQueue = [];

const rtcConfig = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' }
  ],
  iceCandidatePoolSize: 10
};

function setStatus(text, isLive) {
  statusText.textContent = text;
  statusDot.className = 'dot ' + (isLive ? 'live' : '');
}

function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

socket.emit('join-room', { roomId, isHost: (role === 'host') });

if (role === 'host') {
  document.getElementById('btnStream').style.display = 'inline-flex';
  document.getElementById('emptyTitle').textContent = 'Você é o Host';
  document.getElementById('emptySub').textContent = 'Clique em Transmitir Tela para compartilhar sua gameplay.';
  setStatus('Host Pronto', true);
} else {
  btnDockWatch.style.display = 'inline-flex';
}

function tuneSDPAudio(sdp) {
  if (sdp.includes('opus/48000')) {
    sdp = sdp.replace(/a=fmtp:111 .*/g, 'a=fmtp:111 minptime=10;useinbandfec=1;stereo=1;sprop-stereo=1;maxaveragebitrate=256000;cbr=1');
  }
  return sdp;
}

// ==================== HOST ====================
async function toggleStream() {
  if (!localStream) {
    try {
      localStream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 60, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: {
          autoGainControl: false,
          echoCancellation: false,
          noiseSuppression: false,
          channelCount: 2,
          sampleRate: 48000
        },
        systemAudio: 'include'
      });

      const audioTracks = localStream.getAudioTracks();
      if (audioTracks.length > 0) {
        if ('contentHint' in audioTracks[0]) audioTracks[0].contentHint = 'music';
        audioAlert.className = 'audio-alert green';
        audioAlert.textContent = '🔊 ÁUDIO DO JOGO/SISTEMA CAPTURADO COM SUCESSO!';
        audioAlert.style.display = 'block';
        setTimeout(() => audioAlert.style.display = 'none', 5000);
      } else {
        audioAlert.className = 'audio-alert red';
        audioAlert.innerHTML = '⚠️ SEM ÁUDIO: Marque "Compartilhar áudio do sistema" ao escolher a tela!';
        audioAlert.style.display = 'block';
      }

      video.srcObject = localStream;
      video.muted = true;
      video.style.display = 'block';
      emptyState.style.display = 'none';

      const btn = document.getElementById('btnStream');
      btn.className = 'dbtn danger';
      btn.innerHTML = '⏹️ Parar Transmissão';
      setStatus('Ao Vivo (60 FPS)', true);

      socket.emit('host-started-stream', { roomId });
      localStream.getVideoTracks()[0].onended = () => toggleStream();
    } catch (err) {
      showToast('Transmissão cancelada');
    }
  } else {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
    audioAlert.style.display = 'none';
    video.style.display = 'none';
    emptyState.style.display = 'block';

    const btn = document.getElementById('btnStream');
    btn.className = 'dbtn pri';
    btn.innerHTML = '📡 Transmitir Tela';
    setStatus('Transmissão Parada', false);

    socket.emit('host-stopped-stream', { roomId });
    for (let id in peerConnections) peerConnections[id].close();
    peerConnections = {};
  }
}

socket.on('connect-viewer', async ({ viewerId }) => {
  if (!localStream) return;
  if (peerConnections[viewerId]) peerConnections[viewerId].close();

  const pc = new RTCPeerConnection(rtcConfig);
  peerConnections[viewerId] = pc;

  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('webrtc-ice', { to: viewerId, candidate: e.candidate });
  };

  let offer = await pc.createOffer();
  offer.sdp = tuneSDPAudio(offer.sdp);
  await pc.setLocalDescription(offer);
  socket.emit('webrtc-offer', { to: viewerId, offer });
});

socket.on('webrtc-answer', async ({ from, answer }) => {
  const pc = peerConnections[from];
  if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
});

// ==================== VIEWER ====================
function startWatching() {
  watchOverlay.style.display = 'none';
  showToast('Conectando à transmissão...');
  socket.emit('viewer-request-stream', { roomId });
}

socket.on('webrtc-offer', async ({ from, offer }) => {
  if (viewerPC) viewerPC.close();

  viewerPC = new RTCPeerConnection(rtcConfig);
  viewerStream = new MediaStream();
  iceQueue = [];

  video.srcObject = viewerStream;
  audioEl.srcObject = viewerStream;

  viewerPC.ontrack = (event) => {
    viewerStream.addTrack(event.track);

    video.style.display = 'block';
    emptyState.style.display = 'none';
    watchOverlay.style.display = 'none';
    setStatus('Ao Vivo', true);

    video.muted = false;
    video.volume = 1;
    audioEl.muted = false;
    audioEl.volume = 1;

    video.play().catch(()=>{});
    audioEl.play().catch(()=>{});
  };

  viewerPC.onicecandidate = (e) => {
    if (e.candidate) socket.emit('webrtc-ice', { to: from, candidate: e.candidate });
  };

  await viewerPC.setRemoteDescription(new RTCSessionDescription(offer));

  for (const cand of iceQueue) {
    await viewerPC.addIceCandidate(new RTCIceCandidate(cand)).catch(()=>{});
  }
  iceQueue = [];

  let answer = await viewerPC.createAnswer();
  answer.sdp = tuneSDPAudio(answer.sdp);
  await viewerPC.setLocalDescription(answer);
  socket.emit('webrtc-answer', { to: from, answer });
});

socket.on('webrtc-ice', async ({ from, candidate }) => {
  if (role === 'host') {
    const pc = peerConnections[from];
    if (pc && pc.remoteDescription) {
      try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
    }
  } else {
    if (viewerPC && viewerPC.remoteDescription) {
      try { await viewerPC.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
    } else {
      iceQueue.push(candidate);
    }
  }
});

socket.on('stream-is-live', () => {
  if (role !== 'host' && (!video.srcObject || video.style.display === 'none')) {
    watchOverlay.style.display = 'flex';
  }
});

socket.on('stream-ended', () => {
  video.style.display = 'none';
  emptyState.style.display = 'block';
  watchOverlay.style.display = 'none';
  setStatus('Transmissão Pausada', false);
});

socket.on('host-left', () => {
  video.style.display = 'none';
  emptyState.style.display = 'block';
  watchOverlay.style.display = 'none';
  setStatus('Host Saiu', false);
});

socket.on('room-status', (d) => {
  document.getElementById('viewerCount').textContent = d.viewers;
  if (role !== 'host' && d.isStreaming && (!video.srcObject || video.style.display === 'none')) {
    watchOverlay.style.display = 'flex';
  }
});

function setVolume(v) {
  const vol = v / 100;
  video.volume = vol;
  audioEl.volume = vol;
  video.muted = (v == 0);
  audioEl.muted = (v == 0);
  document.getElementById('btnMute').textContent = (v == 0) ? '🔇 Mudo' : '🔊 Som';
}

function toggleMute() {
  video.muted = !video.muted;
  audioEl.muted = video.muted;
  document.getElementById('btnMute').textContent = video.muted ? '🔇 Mudo' : '🔊 Som';
}

function toggleFullscreen() {
  const stage = document.getElementById('stageArea');
  if (!document.fullscreenElement) stage.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}

function copyLink() {
  const url = window.location.origin + '/room/' + roomId + '?role=viewer';
  navigator.clipboard.writeText(url).then(() => showToast('📋 Link copiado com sucesso!'));
}
</script>
</body>
</html>
