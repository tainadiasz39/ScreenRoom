<!DOCTYPE html>

<head>

<title>ScreenRoom</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111214;color:#f2f3f5;font-family:Arial,sans-serif}
header{padding:14px 5vw;background:#2b2d31;display:flex;justify-content:space-between;align-items:center}
main{width:min(1200px,94vw);margin:24px auto}
.stage{background:#000;border-radius:10px;min-height:55vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
video{width:100%;max-height:75vh;display:none}video.active{display:block}
.placeholder{text-align:center;color:#b5bac1;padding:30px}
.panel{background:#2b2d31;border-radius:10px;padding:18px;margin-top:18px}
button{border:0;border-radius:5px;background:#5865f2;color:#fff;padding:11px 14px;font-weight:bold;cursor:pointer;margin:4px}
.danger{background:#da373c}.hidden{display:none}
.request{display:flex;align-items:center;gap:8px;background:#1e1f22;padding:10px;border-radius:6px;margin:8px 0}
.request span{margin-right:auto}.status{color:#b5bac1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2b2d31;padding:12px 18px;border-radius:6px;display:none}.toast.show{display:block}
.chat{height:220px;overflow-y:auto;background:#1e1f22;border-radius:7px;padding:10px;margin:10px 0}
.chatMessage{padding:7px 0;border-bottom:1px solid #33353b;word-break:break-word}
.chatMessage:last-child{border-bottom:0}.chatName{font-weight:bold;color:#8ea1ff}.chatHost{color:#f6c24b}
.chatForm{display:flex;gap:8px}.chatForm input{flex:1;border:0;border-radius:5px;background:#1e1f22;color:#fff;padding:11px}
select{background:#1e1f22;color:#fff;border:0;border-radius:5px;padding:11px;margin:4px}</style>

main{

  grid-template-rows:auto auto !important;
  gap:18px !important;

<body>
<header>
  <strong id="title">ScreenRoom</strong>
  <span id="count" class="status">👥 0 assistindo</span>
  <button onclick="leaveRoom()">Voltar às salas</button>
</header>

<main>
  <section class="stage" id="stage">
    <video id="video" autoplay playsinline controls></video>

    <div id="placeholder" class="placeholder">
      <h2 id="message">Conectando...</h2>
      <p id="detail">Aguarde um momento.</p>
    </div>
  </section>

  <section id="hostControls" class="panel hidden">

    <h3>🔔 Pedidos para entrar</h3>

    <div id="requests" class="status">
      Nenhum pedido pendente.
    </div>
  </section>

  <section id="viewerControls" class="panel hidden">
    <button id="watchButton" class="hidden" onclick="startWatching()">
      ▶ Assistir transmissão
    </button>
  </section></main>

<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const roomId = sessionStorage.getItem("screenroomRoom");
const role = sessionStorage.getItem("screenroomRole");
const name = sessionStorage.getItem("screenroomName") || "Visitante";
const hostKey = sessionStorage.getItem("screenroomHostKey");

if (!roomId || !role) {
  location.replace("/");
}

const isHost = role === "host";
const socket = io();

const video = document.getElementById("video");
const placeholder = document.getElementById("placeholder");
const message = document.getElementById("message");
const detail = document.getElementById("detail");
const requests = document.getElementById("requests");
const watchButton = document.getElementById("watchButton");
const streamButton = document.getElementById("streamButton");
const chatMessages = document.getElementById("chatMessages");
const chatInput = document.getElementById("chatInput");
const resolution = document.getElementById("resolution");

let localStream = null;
let viewerPC = null;
let pendingIce = [];
let streaming = false;

const connections = new Map();

const rtcConfig = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

function showToast(text) {
  const toast = document.getElementById("toast");

  toast.textContent = text;
  toast.classList.add("show");

  setTimeout(() => toast.classList.remove("show"), 3500);
}

function setMessage(title, text) {
  message.textContent = title;
  detail.textContent = text;
}

function leaveRoom() {
  sessionStorage.clear();
  location.href = "/";
}

if (isHost) {
  document.getElementById("hostControls").classList.remove("hidden");

  socket.emit("rejoin-host", {
    roomId,
    hostKey
  });

  setMessage(
    "Você é o host",
    "Inicie a transmissão quando estiver pronto."
  );
} else {
  document.getElementById("viewerControls").classList.remove("hidden");

  socket.emit("request-access", {
    roomId,
    viewerName: name
  });

  setMessage(
    "Pedido enviado",
    "Aguarde o dono aceitar você."
  );
}

socket.on("host-unavailable", leaveRoom);

socket.on("access-pending", ({ roomName }) => {
  document.getElementById("title").textContent = roomName;
});

socket.on("access-approved", ({ roomName, isStreaming }) => {
  document.getElementById("title").textContent = roomName;

  setMessage(
    "Pedido aceito",
    "Você já pode assistir."
  );

  if (isStreaming) {
    watchButton.classList.remove("hidden");
  }

  showToast("Você foi aceito na sala!");
});

socket.on("access-rejected", () => {
  setMessage(
    "Pedido recusado",
    "O dono não autorizou sua entrada."
  );
});

socket.on("access-unavailable", () => {
  setMessage(
    "Sala indisponível",
    "Esta sala não está mais disponível."
  );
});

socket.on("access-request", ({ viewerId, viewerName }) => {
  const row = document.createElement("div");

  row.className = "request";

  const viewer = document.createElement("span");
  viewer.textContent = viewerName;

  const accept = document.createElement("button");
  accept.textContent = "Aceitar";

  accept.onclick = () => {
    socket.emit("approve-access", { viewerId });
    row.remove();
  };

  const reject = document.createElement("button");
  reject.textContent = "Recusar";
  reject.className = "danger";

  reject.onclick = () => {
    socket.emit("reject-access", { viewerId });
    row.remove();
  };

  row.append(viewer, accept, reject);

  if (requests.textContent.includes("Nenhum")) {
    requests.textContent = "";
  }

  requests.append(row);
});

async function toggleStream() {
  if (localStream) {
    stopStream();
    return;
  }

  try {
    const height = Number(resolution.value);
    const width = Math.round(height * 16 / 9);

    localStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        width: { ideal: width },
        height: { ideal: height },
        frameRate: { ideal: 60, max: 60 }
      },
      audio: true
    });

    video.srcObject = localStream;
    video.muted = true;
    video.volume = 0;
    video.classList.add("active");
    placeholder.style.display = "none";

    streaming = true;

    streamButton.textContent = "⏹ Parar transmissão";

    socket.emit("host-live");

    localStream.getVideoTracks()[0].onended = stopStream;

    showToast("Transmissão iniciada!");
  } catch {
    showToast("A transmissão foi cancelada.");
  }
}

function stopStream() {
  if (!localStream) return;

  localStream.getTracks().forEach(track => track.stop());

  localStream = null;
  streaming = false;

  connections.forEach(pc => pc.close());
  connections.clear();

  video.srcObject = null;
  video.classList.remove("active");

  placeholder.style.display = "block";

  setMessage(
    "Você é o host",
    "Clique em transmitir para começar."
  );

  streamButton.textContent = "📡 Transmitir tela";

  socket.emit("host-stop");
}

socket.on("viewer-ready", async ({ viewerId }) => {
  if (!localStream || !streaming) return;

  const pc = new RTCPeerConnection(rtcConfig);

  connections.set(viewerId, pc);

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  pc.onicecandidate = event => {
    if (event.candidate) {
      socket.emit("webrtc-ice", {
        to: viewerId,
        candidate: event.candidate
      });
    }
  };

  const offer = await pc.createOffer();

  await pc.setLocalDescription(offer);

  socket.emit("webrtc-offer", {
    to: viewerId,
    offer: pc.localDescription
  });
});

socket.on("webrtc-answer", async ({ from, answer }) => {
  const pc = connections.get(from);

  if (pc) {
    await pc.setRemoteDescription(answer);
  }
});

function startWatching() {
  watchButton.classList.add("hidden");

  socket.emit("request-stream");

  showToast("Conectando à transmissão...");
}

socket.on("stream-is-live", () => {
  if (!isHost) {
    watchButton.classList.remove("hidden");
  }
});

socket.on("stream-stopped", () => {
  if (isHost) return;

  if (viewerPC) {
    viewerPC.close();
  }

  viewerPC = null;

  video.srcObject = null;
  video.classList.remove("active");

  placeholder.style.display = "block";

  setMessage(
    "Transmissão encerrada",
    "O host parou de compartilhar a tela."
  );
});

socket.on("webrtc-offer", async ({ from, offer }) => {
  if (isHost) return;

  try {
    if (viewerPC) {
      viewerPC.close();
    }

    viewerPC = new RTCPeerConnection(rtcConfig);

    const media = new MediaStream();

    video.srcObject = media;

    viewerPC.ontrack = async event => {
      if (!media.getTracks().some(track => track.id === event.track.id)) {
        media.addTrack(event.track);
      }

      video.classList.add("active");
      placeholder.style.display = "none";

      await video.play().catch(() => {});
    };

    viewerPC.onicecandidate = event => {
      if (event.candidate) {
        socket.emit("webrtc-ice", {
          to: from,
          candidate: event.candidate
        });
      }
    };

    await viewerPC.setRemoteDescription(offer);

    for (const candidate of pendingIce) {
      await viewerPC.addIceCandidate(candidate).catch(() => {});
    }

    pendingIce = [];

    const answer = await viewerPC.createAnswer();

    await viewerPC.setLocalDescription(answer);

    socket.emit("webrtc-answer", {
      to: from,
      answer: viewerPC.localDescription
    });
  } catch {
    showToast("Erro ao conectar à transmissão.");
  }
});

socket.on("webrtc-ice", async ({ from, candidate }) => {
  const pc = isHost ? connections.get(from) : viewerPC;

  if (pc && pc.remoteDescription) {
    await pc.addIceCandidate(candidate).catch(() => {});
  } else if (!isHost) {
    pendingIce.push(candidate);
  }
});

socket.on("room-status", data => {
  document.getElementById("title").textContent =
    data.roomName || "ScreenRoom";

  document.getElementById("count").textContent =
    `👥 ${data.viewers} assistindo`;

  if (!isHost && data.isStreaming) {
    watchButton.classList.remove("hidden");
  }
});

socket.on("host-left", () => {
  if (!isHost) {
    setMessage(
      "O host saiu",
      "A transmissão foi encerrada."
    );
  }
});


function escapeChat(text) {
  const element = document.createElement("span");
  element.textContent = text;
  return element.textContent;
}

function sendChat() {
  const message = chatInput.value.trim();

  if (!message) return;

  socket.emit("chat-message", { message });

  chatInput.value = "";
  chatInput.focus();
}

chatInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendChat();
  }
});

socket.on("chat-message", data => {
  if (chatMessages.textContent.includes("Nenhuma mensagem")) {
    chatMessages.textContent = "";
  }

  const row = document.createElement("div");
  row.className = "chatMessage";

  const sender = document.createElement("span");
  sender.className =
    data.isHost
      ? "chatName chatHost"
      : "chatName";

  sender.textContent = data.sender + ": ";

  const message = document.createElement("span");
  message.textContent = data.message;

  row.append(sender, message);
  chatMessages.append(row);

  chatMessages.scrollTop = chatMessages.scrollHeight;
});
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else {
      await document.getElementById("stage").requestFullscreen();
    }
  } catch {}
}
</script>

}

}

  main{

}
</style>

<script id="layoutFinalScript">
window.addEventListener("DOMContentLoaded", () => {
  const main = document.querySelector("main");
  const stage = document.getElementById("stage");
  const hostPanel = document.getElementById("hostControls");
  const viewerPanel = document.getElementById("viewerControls");
  const chatMessages = document.getElementById("chatMessages");
  const resolution = document.getElementById("resolution");
  const streamButton = document.getElementById("streamButton");
  const fullscreenButton = document.querySelector(
    '[onclick="toggleFullscreen()"]'
  );

  if (!main || !stage) return;

  let sidePanels = document.querySelector(".sidePanels");

  if (!sidePanels) {
    sidePanels = document.createElement("div");
    sidePanels.className = "sidePanels";
    main.append(sidePanels);
  }

  let streamControls = document.getElementById("streamControls");

  if (!streamControls) {
    streamControls = document.createElement("section");
    streamControls.id = "streamControls";
    streamControls.className = "panel";
    stage.insertAdjacentElement("afterend", streamControls);
  }

  if (resolution && resolution.parentElement) {
    streamControls.append(resolution.parentElement);
  }

  if (streamButton) {
    streamControls.append(streamButton);
  }

  if (fullscreenButton) {
    streamControls.append(fullscreenButton);
  }

  if (hostPanel) {
    sidePanels.append(hostPanel);
  }

  if (chatMessages) {
    const chatPanel = chatMessages.closest("section.panel");

    if (chatPanel) {
      sidePanels.append(chatPanel);
    }
  }

  if (viewerPanel) {
    streamControls.append(viewerPanel);
  }
});
</script></body>
