<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenRoom • Discord Live</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
body { background:#1e1f22; color:#dbdee1; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

.topbar {
  height:48px; background:#2b2d31; border-bottom:1px solid #1f2023;
  display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0;
}
.topbar-left { display:flex; align-items:center; gap:8px; font-weight:700; color:#fff; font-size:0.95rem; }
.badge-live {
  background:#f23f42; color:#fff; font-size:0.7rem; font-weight:800; padding:2px 8px; border-radius:4px;
  display:none; align-items:center; gap:4px;
}
.badge-live.show { display:inline-flex; }

.stage {
  flex:1; display:flex; align-items:center; justify-content:center; background:#111214;
  padding:16px; position:relative; overflow:hidden;
}
video {
  width:100%; height:100%; max-height:calc(100vh - 140px); object-fit:contain;
  border-radius:8px; background:#000; box-shadow:0 8px 24px rgba(0,0,0,0.7);
}
.stage:fullscreen video { max-height:100vh; width:100vw; border-radius:0; }

.placeholder {
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; max-width:400px;
}
.placeholder-icon {
  width:72px; height:72px; background:#2b2d31; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2.2rem;
}
.placeholder h2 { color:#f2f3f5; font-size:1.2rem; font-weight:700; }
.placeholder p { color:#949ba4; font-size:0.9rem; line-height:1.4; }

/* OVERLAYS E AVISOS */
.watch-overlay {
  position:absolute; inset:0; background:rgba(17,18,20,0.9); backdrop-filter:blur(6px);
  display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:50;
}
.watch-overlay.show { display:flex; }
.btn-watch-live {
  background:#5865f2; color:#fff; border:none; padding:16px 36px; border-radius:4px;
  font-size:1.05rem; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:10px;
  box-shadow:0 4px 20px rgba(88,101,242,0.5); transition:0.15s;
}
.btn-watch-live:hover { background:#4752c4; transform:scale(1.03); }

.audio-warning {
  position:absolute; top:20px; left:50%; transform:translateX(-50%);
  padding:10px 20px; border-radius:6px; font-weight:700; font-size:0.85rem; z-index:60; display:none;
}
.audio-warning.green { background:#23a55a; color:#fff; }
.audio-warning.red { background:#f23f42; color:#fff; cursor:pointer; }
.audio-warning.blue { background:#5865f2; color:#fff; cursor:pointer; }

.dock {
  height:68px; background:#232428; border-top:1px solid #1e1f22;
  display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0;
}
.d-btn {
  height:38px; padding:0 16px; border-radius:4px; font-weight:600; font-size:0.85rem;
  border:none; cursor:pointer; display:flex; align-items:center; gap:8px; transition:0.15s;
}
.d-btn.primary { background:#5865f2; color:#fff; }
.d-btn.primary:hover { background:#4752c4; }
.d-btn.danger { background:#da373c; color:#fff; }
.d-btn.danger:hover { background:#b82e33; }
.d-btn.secondary { background:#4e5058; color:#fff; }
.d-btn.secondary:hover { background:#6d6f78; }

.vol-box { display:flex; align-items:center; gap:8px; background:#1e1f22; padding:4px 10px; border-radius:4px; }
.vol-slider { -webkit-appearance:none; width:80px; height:4px; border-radius:2px; background:#4e5058; outline:none; }
.vol-slider::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; cursor:pointer; }

.toast {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#111214; border:1px solid #383a40;
  color:#fff; padding:8px 18px; border-radius:4px; font-size:0.85rem; opacity:0; pointer-events:none; transition:0.2s; z-index:200;
}
.toast.show { opacity:1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="d-btn secondary" style="height:30px; padding:0 10px;" onclick="location.href='/'">← Sair</button>
    <span id="roomTitle">Sala</span>
    <div class="badge-live" id="badgeLive">● AO VIVO</div>
  </div>
  <div style="font-size:0.85rem; color:#94a3b8;">
    👥 <span id="viewerCount">0</span> online
  </div>
</div>

<div class="stage" id="stageArea">
  <!-- AVISOS DE ÁUDIO NO TOPO -->
  <div class="audio-warning" id="audioWarning"></div>

  <!-- OVERLAY DE ASSISTIR -->
  <div class="watch-overlay" id="watchOverlay">
    <div style="font-size:3rem;">📡</div>
    <h2 style="color:#fff; font-size:1.4rem;">Transmissão em Andamento!</h2>
    <p style="color:#94a3b8; font-size:0.9rem;">Clique no botão abaixo para assistir em 60 FPS com som do jogo.</p>
    <button class="btn-watch-live" onclick="startWatching()">
      <span>▶</span> Assistir Transmissão
    </button>
  </div>

  <div class="placeholder" id="placeholder">
    <div class="placeholder-icon">🖥️</div>
    <h2 id="placeholderTitle">Aguardando Transmissão</h2>
    <p id="placeholderSub">O host ainda não iniciou o compartilhamento de tela.</p>
  </div>

  <video id="screenVideo" autoplay playsinline style="display:none;" ondblclick="toggleFullscreen()"></video>
</div>

<div class="dock">
  <div style="display:flex; gap:8px;">
    <button class="d-btn primary" id="btnStream" onclick="toggleStream()" style="display:none;">📡 Transmitir Tela</button>
    <button class="d-btn primary" id="btnWatchBar" onclick="startWatching()" style="display:none;">▶ Assistir</button>
  </div>
  <div style="display:flex; gap:8px; align-items:center;">
    <div class="vol-box">
      <button class="d-btn secondary" style="height:28px; padding:0 8px;" id="btnMute" onclick="toggleMute()">🔊</button>
      <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="100" oninput="setVolume(this.value)">
    </div>
    <button class="d-btn secondary" onclick="toggleFullscreen()">⛶ Tela Cheia</button>
    <button class="d-btn secondary" onclick="copyLink()">📋 Copiar Link</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const urlParams = new URLSearchParams(window.location.search);
const role = urlParams.get('role') || 'viewer';
const roomId = window.location.pathname.split('/room/')[1].split('?')[0];

document.getElementById('roomTitle').textContent = '#' + roomId;
const video = document.getElementById('screenVideo');
const placeholder = document.getElementById('placeholder');
const badgeLive = document.getElementById('badgeLive');
const watchOverlay = document.getElementById('watchOverlay');
const audioWarning = document.getElementById('audioWarning');
const btnStream = document.getElementById('btnStream');
const btnWatchBar = document.getElementById('btnWatchBar');

let isHost = (role === 'host');
let localStream = null;
let peerConnections = {};
let viewerPC = null;
let iceQueue = [];

const rtcConfig = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' }
  ],
  iceCandidatePoolSize: 10
};

function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

socket.emit('join-room', { roomId, isHost });

if (isHost) {
  btnStream.style.display = 'inline-flex';
  document.getElementById('placeholderTitle').textContent = 'Você é o Host';
  document.getElementById('placeholderSub').textContent = 'Clique em "Transmitir Tela" para compartilhar com som do jogo.';
}

// ======================== HOST ========================
async function toggleStream() {
  if (!localStream) {
    try {
      localStream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 60, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: {
          autoGainControl: false,
          echoCancellation: false,
          noiseSuppression: false,
          channelCount: 2
        }
      });

      const audioTracks = localStream.getAudioTracks();
      if (audioTracks.length > 0) {
        audioWarning.className = 'audio-warning green';
        audioWarning.textContent = '🔊 Áudio do Sistema/Jogo Capturado!';
        audioWarning.style.display = 'block';
        setTimeout(() => audioWarning.style.display = 'none', 4000);
      } else {
        audioWarning.className = 'audio-warning red';
        audioWarning.innerHTML = '⚠️ SEM ÁUDIO: Você não marcou "Compartilhar áudio do sistema"! (Clique para refazer)';
        audioWarning.style.display = 'block';
        audioWarning.onclick = () => { toggleStream(); setTimeout(toggleStream, 300); };
      }

      video.srcObject = localStream;
      video.muted = true; // Host mudo para não dar retorno
      video.style.display = 'block';
      placeholder.style.display = 'none';
      badgeLive.classList.add('show');

      btnStream.className = 'd-btn danger';
      btnStream.innerHTML = '⏹ Parar Transmissão';

      socket.emit('host-live', { roomId });
      localStream.getVideoTracks()[0].onended = () => toggleStream();
    } catch (e) {
      showToast('Transmissão cancelada');
    }
  } else {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
    audioWarning.style.display = 'none';
    video.style.display = 'none';
    placeholder.style.display = 'flex';
    badgeLive.classList.remove('show');

    btnStream.className = 'd-btn primary';
    btnStream.innerHTML = '📡 Transmitir Tela';

    socket.emit('host-stop', { roomId });
    for (let id in peerConnections) peerConnections[id].close();
    peerConnections = {};
  }
}

// Host cria a conexão WebRTC enviando vídeo E áudio
socket.on('viewer-ready', async ({ viewerId }) => {
  if (!localStream) return;
  if (peerConnections[viewerId]) peerConnections[viewerId].close();

  const pc = new RTCPeerConnection(rtcConfig);
  peerConnections[viewerId] = pc;

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('webrtc-ice', { to: viewerId, candidate: e.candidate });
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('webrtc-offer', { to: viewerId, offer });
});

socket.on('webrtc-answer', async ({ from, answer }) => {
  const pc = peerConnections[from];
  if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
});

// ======================== VIEWER ========================
function startWatching() {
  watchOverlay.classList.remove('show');
  btnWatchBar.style.display = 'none';
  showToast('Conectando...');
  socket.emit('request-stream', { roomId });
}

socket.on('webrtc-offer', async ({ from, offer }) => {
  if (viewerPC) viewerPC.close();

  viewerPC = new RTCPeerConnection(rtcConfig);
  const mediaStream = new MediaStream();
  iceQueue = [];

  video.srcObject = mediaStream;

  viewerPC.ontrack = (event) => {
    mediaStream.addTrack(event.track);

    video.style.display = 'block';
    placeholder.style.display = 'none';
    watchOverlay.classList.remove('show');
    badgeLive.classList.add('show');

    // Desbloqueia vídeo e áudio imediatamente
    video.muted = false;
    video.volume = 1;
    video.play().catch(() => {
      // Se o Chrome barrar o som, muta primeiro para a imagem aparecer e mostra aviso
      video.muted = true;
      video.play();
      audioWarning.className = 'audio-warning blue';
      audioWarning.innerHTML = '🔊 Clique aqui para ouvir o áudio do jogo!';
      audioWarning.style.display = 'block';
      audioWarning.onclick = () => {
        video.muted = false;
        video.volume = 1;
        audioWarning.style.display = 'none';
        document.getElementById('btnMute').textContent = '🔊';
      };
    });
  };

  viewerPC.onicecandidate = (e) => {
    if (e.candidate) socket.emit('webrtc-ice', { to: from, candidate: e.candidate });
  };

  await viewerPC.setRemoteDescription(new RTCSessionDescription(offer));

  for (const cand of iceQueue) {
    await viewerPC.addIceCandidate(new RTCIceCandidate(cand)).catch(() => {});
  }
  iceQueue = [];

  const answer = await viewerPC.createAnswer();
  await viewerPC.setLocalDescription(answer);
  socket.emit('webrtc-answer', { to: from, answer });
});

socket.on('webrtc-ice', async ({ from, candidate }) => {
  if (isHost) {
    const pc = peerConnections[from];
    if (pc && pc.remoteDescription) {
      try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){}
    }
  } else {
    if (viewerPC && viewerPC.remoteDescription) {
      try { await viewerPC.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){}
    } else {
      iceQueue.push(candidate);
    }
  }
});

socket.on('stream-is-live', () => {
  if (!isHost) {
    watchOverlay.classList.add('show');
    btnWatchBar.style.display = 'inline-flex';
    badgeLive.classList.add('show');
  }
});

socket.on('stream-stopped', () => {
  video.style.display = 'none';
  placeholder.style.display = 'flex';
  watchOverlay.classList.remove('show');
  badgeLive.classList.remove('show');
  btnWatchBar.style.display = 'none';
  audioWarning.style.display = 'none';
});

socket.on('host-left', () => {
  video.style.display = 'none';
  placeholder.style.display = 'flex';
  watchOverlay.classList.remove('show');
  badgeLive.classList.remove('show');
});

socket.on('room-status', (d) => {
  document.getElementById('viewerCount').textContent = d.viewers;
  if (!isHost && d.isStreaming && (!video.srcObject || video.style.display === 'none')) {
    watchOverlay.classList.add('show');
    btnWatchBar.style.display = 'inline-flex';
    badgeLive.classList.add('show');
  }
});

// ======================== CONTROLES ========================
function setVolume(v) {
  video.volume = v / 100;
  video.muted = (v == 0);
  document.getElementById('btnMute').textContent = (v == 0) ? '🔇' : '🔊';
}
function toggleMute() {
  video.muted = !video.muted;
  document.getElementById('btnMute').textContent = video.muted ? '🔇' : '🔊';
}
function toggleFullscreen() {
  const stage = document.getElementById('stageArea');
  if (!document.fullscreenElement) stage.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}
function copyLink() {
  const url = window.location.origin + '/room/' + roomId + '?role=viewer';
  navigator.clipboard.writeText(url).then(() => showToast('📋 Link copiado com sucesso!'));
}
</script>
</body>
</html>
