<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ScreenRoom</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {

  width: 100%;
  height: 100%;

  margin: 0;

  overflow: hidden;

  background: #111214;

  color: #dbdee1;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

body {

  display: flex;

  flex-direction: column;

}


/* ==========================================================
TOPO
========================================================== */

.topbar {

  height: 52px;

  flex-shrink: 0;

  background: #2b2d31;

  border-bottom:
    1px solid #1e1f22;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 16px;

}

.room-name {

  display: flex;

  align-items: center;

  gap: 10px;

  font-weight: bold;

  color: #fff;

}

.room-icon {

  color: #949ba4;

}

.live {

  display: none;

  background: #ed4245;

  color: white;

  font-size: 11px;

  font-weight: bold;

  padding: 5px 8px;

  border-radius: 4px;

}

.live.show {

  display: inline-block;

}

.online {

  color: #b5bac1;

  font-size: 13px;

}


/* ==========================================================
PALCO
========================================================== */

.stage {

  flex: 1;

  min-height: 0;

  position: relative;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #111214;

  padding: 12px;

}

video {

  display: none;

  width: 100%;

  height: 100%;

  object-fit: contain;

  background: #000;

  border-radius: 8px;

}

video.active {

  display: block;

}

.placeholder {

  text-align: center;

  max-width: 420px;

  padding: 30px;

}

.placeholder-icon {

  width: 80px;

  height: 80px;

  border-radius: 50%;

  margin: 0 auto 18px;

  background: #2b2d31;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 36px;

}

.placeholder h2 {

  margin: 0 0 10px;

  color: #f2f3f5;

}

.placeholder p {

  margin: 0;

  color: #949ba4;

  line-height: 1.5;

}


/* ==========================================================
OVERLAY
========================================================== */

.overlay {

  display: none;

  position: absolute;

  inset: 0;

  background:
    rgba(17,18,20,.94);

  align-items: center;

  justify-content: center;

  flex-direction: column;

  gap: 15px;

  z-index: 20;

}

.overlay.show {

  display: flex;

}

.overlay-title {

  font-size: 22px;

  font-weight: bold;

  color: white;

}

.overlay-sub {

  color: #949ba4;

  text-align: center;

}

.primary {

  background: #5865f2;

  color: white;

  border: 0;

  border-radius: 5px;

  padding: 13px 24px;

  font-weight: bold;

  cursor: pointer;

}

.primary:hover {

  background: #4752c4;

}


/* ==========================================================
AVISO AUDIO
========================================================== */

.audio-message {

  position: absolute;

  top: 20px;

  left: 50%;

  transform:
    translateX(-50%);

  z-index: 40;

  display: none;

  background: #23a55a;

  color: white;

  padding: 10px 16px;

  border-radius: 5px;

  font-size: 13px;

  font-weight: bold;

}

.audio-message.show {

  display: block;

}

.audio-message.warning {

  background: #f0a020;

}


/* ==========================================================
DOCK
========================================================== */

.dock {

  height: 72px;

  flex-shrink: 0;

  background: #232428;

  border-top:
    1px solid #1e1f22;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 14px;

}

.buttons {

  display: flex;

  gap: 8px;

}

.btn {

  height: 40px;

  padding: 0 16px;

  border: 0;

  border-radius: 5px;

  color: white;

  background: #4e5058;

  cursor: pointer;

  font-weight: bold;

}

.btn:hover {

  background: #6d6f78;

}

.btn.stream {

  background: #5865f2;

}

.btn.stream:hover {

  background: #4752c4;

}

.btn.stop {

  background: #da373c;

}

.btn.stop:hover {

  background: #b82e33;

}

.controls {

  display: flex;

  align-items: center;

  gap: 8px;

}

.volume {

  display: flex;

  align-items: center;

  gap: 8px;

  background: #1e1f22;

  padding: 5px 10px;

  border-radius: 5px;

}

.volume input {

  width: 90px;

}

.toast {

  position: fixed;

  bottom: 90px;

  left: 50%;

  transform:
    translateX(-50%);

  background: #111214;

  border:
    1px solid #3f4147;

  color: white;

  padding: 10px 18px;

  border-radius: 5px;

  opacity: 0;

  pointer-events: none;

  transition: .2s;

  z-index: 100;

}

.toast.show {

  opacity: 1;

}


/* ==========================================================
RESPONSIVO
========================================================== */

@media(max-width:700px) {

  .dock {

    height: auto;

    min-height: 70px;

    padding: 8px;

    gap: 8px;

  }

  .controls {

    gap: 4px;

  }

  .volume {

    display: none;

  }

  .btn {

    padding: 0 10px;

    font-size: 12px;

  }

}

</style>

</head>


<body>


<!-- ========================================================
TOPO
========================================================= -->

<header class="topbar">

  <div class="room-name">

    <span class="room-icon">
      #
    </span>

    <span id="roomName">
      Sala
    </span>

    <span
      class="live"
      id="liveBadge"
    >
      AO VIVO
    </span>

  </div>


  <div class="online">

    👥
    <span id="onlineCount">
      0
    </span>
    online

  </div>

</header>


<!-- ========================================================
PALCO
========================================================= -->

<main
  class="stage"
  id="stage"
>


  <div
    class="placeholder"
    id="placeholder"
  >

    <div class="placeholder-icon">
      🖥️
    </div>

    <h2 id="placeholderTitle">
      Aguardando transmissão
    </h2>

    <p id="placeholderText">
      O host ainda não começou a compartilhar a tela.
    </p>

  </div>


  <video
    id="screenVideo"
    autoplay
    playsinline
    controls="false"
  ></video>


  <!-- ======================================================
  OVERLAY ASSISTIR
  ======================================================= -->

  <div
    class="overlay"
    id="watchOverlay"
  >

    <div style="font-size:48px;">
      📡
    </div>

    <div class="overlay-title">
      Transmissão ao vivo
    </div>

    <div class="overlay-sub">
      Clique para assistir à tela e ouvir o áudio.
    </div>

    <button
      class="primary"
      onclick="startWatching()"
    >
      ▶ Assistir transmissão
    </button>

  </div>


  <div
    class="audio-message"
    id="audioMessage"
  ></div>


</main>


<!-- ========================================================
DOCK
========================================================= -->

<footer class="dock">


  <div class="buttons">

    <button
      class="btn stream"
      id="streamButton"
      onclick="toggleStream()"
      style="display:none"
    >
      📡 Transmitir tela
    </button>


    <button
      class="btn"
      id="watchButton"
      onclick="startWatching()"
      style="display:none"
    >
      ▶ Assistir
    </button>


    <button
      class="btn"
      onclick="copyLink()"
    >
      🔗 Copiar link
    </button>

  </div>


  <div class="controls">


    <div class="volume">

      <button
        class="btn"
        id="muteButton"
        onclick="toggleMute()"
        style="height:30px;padding:0 8px"
      >
        🔊
      </button>

      <input
        id="volumeSlider"
        type="range"
        min="0"
        max="100"
        value="100"
        oninput="changeVolume(this.value)"
      >

    </div>


    <button
      class="btn"
      onclick="toggleFullscreen()"
    >
      ⛶ Tela cheia
    </button>


  </div>

</footer>


<div
  class="toast"
  id="toast"
></div>


<script src="/socket.io/socket.io.js"></script>


<script>

/*
============================================================
CONFIGURAÇÃO
============================================================
*/

const socket =
  io({
    transports: [
      "websocket",
      "polling"
    ]
  });


const pathParts =
  window.location.pathname
    .split("/");


const roomId =
  decodeURIComponent(
    pathParts[
      pathParts.length - 1
    ]
  ).toUpperCase();


const params =
  new URLSearchParams(
    window.location.search
  );


const isHost =
  params.get("role") === "host";


document
  .getElementById("roomName")
  .textContent =
  roomId;


/*
============================================================
ELEMENTOS
============================================================
*/

const video =
  document.getElementById(
    "screenVideo"
  );


const placeholder =
  document.getElementById(
    "placeholder"
  );


const placeholderTitle =
  document.getElementById(
    "placeholderTitle"
  );


const placeholderText =
  document.getElementById(
    "placeholderText"
  );


const liveBadge =
  document.getElementById(
    "liveBadge"
  );


const watchOverlay =
  document.getElementById(
    "watchOverlay"
  );


const streamButton =
  document.getElementById(
    "streamButton"
  );


const watchButton =
  document.getElementById(
    "watchButton"
  );


const audioMessage =
  document.getElementById(
    "audioMessage"
  );


/*
============================================================
WEBRTC
============================================================
*/

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    },

    {
      urls:
        "stun:stun1.l.google.com:19302"
    },

    {
      urls:
        "stun:stun.cloudflare.com:3478"
    },

    /*
    TURN fallback
    */

    {
      urls:
        "turn:openrelay.metered.ca:80",

      username:
        "openrelay",

      credential:
        "openrelay"
    },

    {
      urls:
        "turn:openrelay.metered.ca:443",

      username:
        "openrelay",

      credential:
        "openrelay"
    }

  ],

  iceCandidatePoolSize: 10

};


/*
============================================================
ESTADO
============================================================
*/

let localStream =
  null;


let viewerConnections =
  new Map();


let viewerPC =
  null;


let pendingIce =
  [];


let isStreaming =
  false;


/*
============================================================
TOAST
============================================================
*/

function showToast(
  text
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    text;


  toast.classList.add(
    "show"
  );


  setTimeout(
    () => {

      toast.classList.remove(
        "show"
      );

    },
    2500
  );

}


/*
============================================================
ENTRAR NA SALA
============================================================
*/

socket.emit(
  "join-room",
  {

    roomId,

    isHost

  }
);


/*
============================================================
HOST INTERFACE
============================================================
*/

if (isHost) {

  streamButton.style.display =
    "inline-block";


  placeholderTitle.textContent =
    "Você é o host";


  placeholderText.textContent =
    "Clique em “Transmitir tela” para começar.";

}


/*
============================================================
HOST - TRANSMITIR
============================================================
*/

async function toggleStream() {

  if (
    !localStream
  ) {

    await startStream();

  } else {

    stopStream();

  }

}


/*
============================================================
INICIAR STREAM
============================================================
*/

async function startStream() {

  try {

    showToast(
      "Preparando captura de tela..."
    );


    /*
    --------------------------------------------------------
    CAPTURA
    --------------------------------------------------------
    */

    localStream =
      await navigator
        .mediaDevices
        .getDisplayMedia({

          video: {

            width: {
              ideal: 1920,
              max: 3840
            },

            height: {
              ideal: 1080,
              max: 2160
            },

            frameRate: {
              ideal: 60,
              max: 60
            }

          },

          audio: {

            channelCount: 2,

            echoCancellation: false,

            noiseSuppression: false,

            autoGainControl: false

          }

        });


    /*
    --------------------------------------------------------
    VERIFICA VÍDEO
    --------------------------------------------------------
    */

    const videoTracks =
      localStream.getVideoTracks();


    if (
      videoTracks.length === 0
    ) {

      throw new Error(
        "Nenhuma faixa de vídeo foi capturada."
      );

    }


    /*
    --------------------------------------------------------
    VERIFICA AUDIO
    --------------------------------------------------------
    */

    const audioTracks =
      localStream.getAudioTracks();


    if (
      audioTracks.length > 0
    ) {

      showAudioMessage(
        "🔊 Áudio do sistema capturado",
        false
      );

    } else {

      showAudioMessage(
        "⚠️ A tela foi capturada, mas o áudio do sistema não foi disponibilizado.",
        true
      );

    }


    /*
    --------------------------------------------------------
    MOSTRA PREVIEW HOST
    --------------------------------------------------------
    */

    video.srcObject =
      localStream;


    video.muted =
      true;


    video.classList.add(
      "active"
    );


    placeholder.style.display =
      "none";


    liveBadge.classList.add(
      "show"
    );


    streamButton.classList.remove(
      "stream"
    );


    streamButton.classList.add(
      "stop"
    );


    streamButton.textContent =
      "⏹ Parar transmissão";


    isStreaming =
      true;


    socket.emit(
      "host-live",
      {
        roomId
      }
    );


    /*
    --------------------------------------------------------
    SE O USUÁRIO PARAR PELO BOTÃO DO SISTEMA
    --------------------------------------------------------
    */

    videoTracks[0].onended =
      () => {

        if (localStream) {

          stopStream();

        }

      };


    showToast(
      "Transmissão iniciada!"
    );


  } catch (error) {

    console.error(
      "Erro ao iniciar:",
      error
    );


    localStream =
      null;


    showToast(
      "A transmissão foi cancelada."
    );

  }

}


/*
============================================================
PARAR STREAM
============================================================
*/

function stopStream() {

  if (
    localStream
  ) {

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  localStream =
    null;


  isStreaming =
    false;


  for (
    const pc
    of viewerConnections.values()
  ) {

    try {

      pc.close();

    } catch {}

  }


  viewerConnections.clear();


  video.srcObject =
    null;


  video.classList.remove(
    "active"
  );


  placeholder.style.display =
    "block";


  placeholderTitle.textContent =
    "Você é o host";


  placeholderText.textContent =
    "Clique em “Transmitir tela” para começar.";


  liveBadge.classList.remove(
    "show"
  );


  streamButton.classList.remove(
    "stop"
  );


  streamButton.classList.add(
    "stream"
  );


  streamButton.textContent =
    "📡 Transmitir tela";


  audioMessage.classList.remove(
    "show"
  );


  socket.emit(
    "host-stop",
    {
      roomId
    }
  );

}


/*
============================================================
HOST - NOVO VIEWER
============================================================
*/

socket.on(
  "viewer-ready",
  async ({
    viewerId
  }) => {

    if (
      !localStream ||
      !isStreaming
    ) {

      return;

    }


    try {

      if (
        viewerConnections.has(
          viewerId
        )
      ) {

        try {

          viewerConnections
            .get(viewerId)
            .close();

        } catch {}

      }


      const pc =
        new RTCPeerConnection(
          rtcConfig
        );


      viewerConnections.set(
        viewerId,
        pc
      );


      /*
      ------------------------------------------------------
      ADICIONA VIDEO + AUDIO
      ------------------------------------------------------
      */

      for (
        const track
        of localStream.getTracks()
      ) {

        pc.addTrack(
          track,
          localStream
        );

      }


      /*
      ------------------------------------------------------
      ICE
      ------------------------------------------------------
      */

      pc.onicecandidate =
        event => {

          if (
            event.candidate
          ) {

            socket.emit(
              "webrtc-ice",
              {

                to:
                  viewerId,

                candidate:
                  event.candidate

              }
            );

          }

        };


      pc.onconnectionstatechange =
        () => {

          console.log(
            "Host -> viewer:",
            viewerId,
            pc.connectionState
          );


          if (
            pc.connectionState ===
              "failed" ||
            pc.connectionState ===
              "closed"
          ) {

            viewerConnections.delete(
              viewerId
            );

          }

        };


      /*
      ------------------------------------------------------
      OFFER
      ------------------------------------------------------
      */

      const offer =
        await pc.createOffer();


      await pc.setLocalDescription(
        offer
      );


      socket.emit(
        "webrtc-offer",
        {

          to:
            viewerId,

          offer:
            pc.localDescription

        }
      );


    } catch (error) {

      console.error(
        "Erro criando conexão:",
        error
      );

    }

  }
);


/*
============================================================
HOST - ANSWER
============================================================
*/

socket.on(
  "webrtc-answer",
  async ({
    from,
    answer
  }) => {

    if (!isHost) return;


    const pc =
      viewerConnections.get(
        from
      );


    if (!pc) return;


    try {

      await pc.setRemoteDescription(
        new RTCSessionDescription(
          answer
        )
      );


    } catch (error) {

      console.error(
        "Erro no answer:",
        error
      );

    }

  }
);


/*
============================================================
VIEWER - ASSISTIR
============================================================
*/

function startWatching() {

  watchOverlay.classList.remove(
    "show"
  );


  watchButton.style.display =
    "none";


  showToast(
    "Conectando à transmissão..."
  );


  socket.emit(
    "request-stream",
    {
      roomId
    }
  );

}


/*
============================================================
TRANSMISSÃO DISPONÍVEL
============================================================
*/

socket.on(
  "stream-is-live",
  () => {

    if (
      isHost
    ) {

      return;

    }


    watchOverlay.classList.add(
      "show"
    );


    watchButton.style.display =
      "inline-block";


    liveBadge.classList.add(
      "show"
    );

  }
);


/*
============================================================
VIEWER RECEBE OFFER
============================================================
*/

socket.on(
  "webrtc-offer",
  async ({
    from,
    offer
  }) => {

    if (
      isHost
    ) {

      return;

    }


    try {

      if (
        viewerPC
      ) {

        viewerPC.close();

      }


      viewerPC =
        new RTCPeerConnection(
          rtcConfig
        );


      pendingIce =
        [];


      const mediaStream =
        new MediaStream();


      video.srcObject =
        mediaStream;


      /*
      ------------------------------------------------------
      RECEBE VIDEO + AUDIO
      ------------------------------------------------------
      */

      viewerPC.ontrack =
        async event => {

          console.log(
            "Track recebida:",
            event.track.kind
          );


          /*
          Evita adicionar a mesma track
          duas vezes.
          */

          if (
            !mediaStream
              .getTracks()
              .some(
                track =>
                  track.id ===
                  event.track.id
              )
          ) {

            mediaStream.addTrack(
              event.track
            );

          }


          video.classList.add(
            "active"
          );


          placeholder.style.display =
            "none";


          watchOverlay.classList.remove(
            "show"
          );


          liveBadge.classList.add(
            "show"
          );


          /*
          ----------------------------------------------
          ÁUDIO
          ----------------------------------------------
          */

          const hasAudio =
            mediaStream
              .getAudioTracks()
              .length > 0;


          if (
            hasAudio
          ) {

            showAudioMessage(
              "🔊 Áudio da transmissão conectado",
              false
            );

          }


          video.muted =
            false;

          video.volume =
            1;


          try {

            await video.play();

          } catch (error) {

            /*
            Navegador bloqueou autoplay.
            O botão fica disponível.
            */

            video.muted =
              true;


            await video
              .play()
              .catch(
                () => {}
              );


            showAudioMessage(
              "🔊 Clique aqui para ativar o áudio",
              true
            );


            audioMessage.onclick =
              async () => {

                video.muted =
                  false;

                video.volume =
                  1;

                await video
                  .play()
                  .catch(
                    () => {}
                  );


                audioMessage.classList.remove(
                  "show"
                );

              };

          }

        };


      /*
      ------------------------------------------------------
      ICE VIEWER
      ------------------------------------------------------
      */

      viewerPC.onicecandidate =
        event => {

          if (
            event.candidate
          ) {

            socket.emit(
              "webrtc-ice",
              {

                to:
                  from,

                candidate:
                  event.candidate

              }
            );

          }

        };


      viewerPC.onconnectionstatechange =
        () => {

          console.log(
            "Viewer:",
            viewerPC.connectionState
          );


          if (
            viewerPC.connectionState ===
            "failed"
          ) {

            showToast(
              "Não foi possível conectar à transmissão."
            );

          }

        };


      /*
      ------------------------------------------------------
      OFFER
      ------------------------------------------------------
      */

      await viewerPC.setRemoteDescription(
        new RTCSessionDescription(
          offer
        )
      );


      /*
      ------------------------------------------------------
      ICE QUEUE
      ------------------------------------------------------
      */

      for (
        const candidate
        of pendingIce
      ) {

        await viewerPC
          .addIceCandidate(
            new RTCIceCandidate(
              candidate
            )
          )
          .catch(
            () => {}
          );

      }


      pendingIce =
        [];


      /*
      ------------------------------------------------------
      ANSWER
      ------------------------------------------------------
      */

      const answer =
        await viewerPC.createAnswer();


      await viewerPC.setLocalDescription(
        answer
      );


      socket.emit(
        "webrtc-answer",
        {

          to:
            from,

          answer:
            viewerPC.localDescription

        }
      );


    } catch (error) {

      console.error(
        "Erro no viewer:",
        error
      );


      showToast(
        "Erro ao conectar à transmissão."
      );

    }

  }
);


/*
============================================================
ICE
============================================================
*/

socket.on(
  "webrtc-ice",
  async ({
    from,
    candidate
  }) => {

    if (!candidate) {
      return;
    }


    /*
    --------------------------------------------------------
    HOST
    --------------------------------------------------------
    */

    if (isHost) {

      const pc =
        viewerConnections.get(
          from
        );


      if (
        pc &&
        pc.remoteDescription
      ) {

        try {

          await pc.addIceCandidate(
            new RTCIceCandidate(
              candidate
            )
          );

        } catch {}

      }


      return;

    }


    /*
    --------------------------------------------------------
    VIEWER
    --------------------------------------------------------
    */

    if (
      viewerPC &&
      viewerPC.remoteDescription
    ) {

      try {

        await viewerPC.addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

      } catch {}

    } else {

      pendingIce.push(
        candidate
      );

    }

  }
);


/*
============================================================
PARA TODOS
============================================================
*/

socket.on(
  "stream-stopped",
  () => {

    if (
      !isHost
    ) {

      if (
        viewerPC
      ) {

        viewerPC.close();

        viewerPC =
          null;

      }


      video.srcObject =
        null;


      video.classList.remove(
        "active"
      );


      placeholder.style.display =
        "block";


      placeholderTitle.textContent =
        "Transmissão encerrada";


      placeholderText.textContent =
        "O host parou de compartilhar a tela.";


      watchOverlay.classList.remove(
        "show"
      );


      watchButton.style.display =
        "none";


      liveBadge.classList.remove(
        "show"
      );


      audioMessage.classList.remove(
        "show"
      );

    }

  }
);


/*
============================================================
HOST SAIU
============================================================
*/

socket.on(
  "host-left",
  () => {

    if (
      isHost
    ) {

      return;

    }


    if (
      viewerPC
    ) {

      viewerPC.close();

      viewerPC =
        null;

    }


    video.srcObject =
      null;


    video.classList.remove(
      "active"
    );


    placeholder.style.display =
      "block";


    placeholderTitle.textContent =
      "O host saiu";


    placeholderText.textContent =
      "A transmissão foi encerrada.";


    watchOverlay.classList.remove(
      "show"
    );


    watchButton.style.display =
      "none";


    liveBadge.classList.remove(
      "show"
    );

  }
);


/*
============================================================
SALA EXPIRADA
============================================================
*/

socket.on(
  "room-expired",
  () => {

    alert(
      "Esta sala expirou."
    );


    window.location.href =
      "/";

  }
);


/*
============================================================
STATUS
============================================================
*/

socket.on(
  "room-status",
  data => {

    document
      .getElementById(
        "onlineCount"
      )
      .textContent =
      data.viewers;


    if (
      !isHost &&
      data.isStreaming &&
      !video.classList.contains(
        "active"
      )
    ) {

      watchOverlay.classList.add(
        "show"
      );


      watchButton.style.display =
        "inline-block";


      liveBadge.classList.add(
        "show"
      );

    }

  }
);


/*
============================================================
HOST NEGADO
============================================================
*/

socket.on(
  "host-denied",
  () => {

    alert(
      "Esta sala já possui um host."
    );


    window.location.href =
      "/";

  }
);


/*
============================================================
AUDIO
============================================================
*/

function showAudioMessage(
  message,
  warning
) {

  audioMessage.textContent =
    message;


  audioMessage.classList.add(
    "show"
  );


  if (warning) {

    audioMessage.classList.add(
      "warning"
    );

  } else {

    audioMessage.classList.remove(
      "warning"
    );

  }


  setTimeout(
    () => {

      audioMessage.classList.remove(
        "show"
      );

    },
    4000
  );

}


/*
============================================================
VOLUME
============================================================
*/

function changeVolume(
  value
) {

  video.volume =
    Number(value) / 100;


  video.muted =
    Number(value) === 0;


  document
    .getElementById(
      "muteButton"
    )
    .textContent =
      video.muted
        ? "🔇"
        : "🔊";

}


/*
============================================================
MUDO
============================================================
*/

function toggleMute() {

  video.muted =
    !video.muted;


  document
    .getElementById(
      "muteButton"
    )
    .textContent =
      video.muted
        ? "🔇"
        : "🔊";

}


/*
============================================================
TELA CHEIA
============================================================
*/

async function toggleFullscreen() {

  try {

    if (
      !document.fullscreenElement
    ) {

      await document
        .getElementById(
          "stage"
        )
        .requestFullscreen();

    } else {

      await document.exitFullscreen();

    }

  } catch {}

}


/*
============================================================
COPIAR LINK
============================================================
*/

async function copyLink() {

  const link =
    window.location.origin +
    "/room/" +
    roomId +
    "?role=viewer";


  try {

    await navigator
      .clipboard
      .writeText(link);


    showToast(
      "Link da sala copiado!"
    );

  } catch {

    showToast(
      "Não foi possível copiar."
    );

  }

}


/*
============================================================
SAIR / FECHAR
============================================================
*/

window.addEventListener(
  "beforeunload",
  () => {

    if (
      isHost &&
      localStream
    ) {

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

  }
);

</script>

</body>
