<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenRoom • Live</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
body { background:#080a11; color:#f1f5f9; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

.topbar { height:56px; background:rgba(13,17,28,0.95); border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0; }
.status-pill { display:flex; align-items:center; gap:8px; font-size:0.8rem; background:rgba(255,255,255,0.05); padding:6px 14px; border-radius:20px; font-weight:700; }
.dot { width:8px; height:8px; border-radius:50%; background:#eab308; }
.dot.live { background:#22c55e; box-shadow:0 0 10px #22c55e; }

.stage { flex:1; display:flex; align-items:center; justify-content:center; background:#06080e; padding:12px; position:relative; overflow:hidden; }
video { width:100%; height:100%; max-height:calc(100vh - 130px); object-fit:contain; border-radius:14px; background:#000; box-shadow:0 20px 50px rgba(0,0,0,0.8); }
.stage:fullscreen video { max-height:100vh; width:100vw; border-radius:0; }

.unmute-banner {
  position:absolute; top:20px; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,#6366f1,#4f46e5); color:#fff; border:none;
  padding:12px 24px; border-radius:30px; font-weight:700; font-size:0.9rem;
  cursor:pointer; box-shadow:0 10px 25px rgba(99,102,241,0.5); z-index:50; display:none;
}

.dock-bar { height:68px; background:#0d111c; border-top:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:space-between; padding:0 18px; flex-shrink:0; }
.dbtn { background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.1); padding:9px 16px; border-radius:12px; font-size:0.85rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
.dbtn.pri { background:linear-gradient(135deg,#6366f1,#4f46e5); border:none; }
.dbtn.danger { background:#ef4444; border:none; }

.vslider { -webkit-appearance:none; width:90px; height:5px; border-radius:5px; background:rgba(255,255,255,0.2); outline:none; cursor:pointer; }
.vslider::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:#6366f1; cursor:pointer; }

.toast { position:fixed; bottom:85px; left:50%; transform:translateX(-50%); background:#1f2937; border:1px solid #6366f1; color:#fff; padding:10px 20px; border-radius:25px; font-size:0.85rem; opacity:0; transition:0.3s; pointer-events:none; z-index:100; }
.toast.show { opacity:1; }
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex; align-items:center; gap:10px;">
    <button class="dbtn" onclick="location.href='/'">←</button>
    <span id="roomTitle" style="font-weight:700;">Sala</span>
    <div class="status-pill">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Aguardando</span>
    </div>
  </div>
  <span style="font-size:0.85rem; color:#94a3b8;">👥 <span id="viewerCount">0</span> online</span>
</div>

<div class="stage" id="stageArea">
  <button class="unmute-banner" id="unmuteBtn" onclick="enableAudio()">🔊 Clique para Ativar o Áudio</button>
  
  <div id="emptyState" style="text-align:center; color:#94a3b8;">
    <div style="font-size:3.5rem;">🖥️</div>
    <h3 style="color:#fff; margin:6px 0;" id="emptyTitle">Aguardando Transmissão</h3>
    <p style="font-size:0.85rem;" id="emptySub">O host ainda não iniciou a tela.</p>
  </div>
  <video id="screenVideo" autoplay playsinline style="display:none;" ondblclick="toggleFullscreen()"></video>
</div>

<div class="dock-bar">
  <div style="display:flex; gap:8px;">
    <button class="dbtn pri" id="btnStream" onclick="toggleStream()" style="display:none;">📡 Transmitir Tela</button>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <button class="dbtn" id="btnMute" onclick="toggleMute()">🔊</button>
    <input type="range" class="vslider" id="volSlider" min="0" max="100" value="100" oninput="setVolume(this.value)">
    <button class="dbtn" onclick="toggleFullscreen()">⛶ Tela Cheia</button>
    <button class="dbtn" onclick="copyLink()">📋 Copiar Link</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const urlParams = new URLSearchParams(window.location.search);
const role = urlParams.get('role') || 'viewer';
const roomId = window.location.pathname.split('/room/')[1];

document.getElementById('roomTitle').textContent = '#' + roomId;
const video = document.getElementById('screenVideo');
const emptyState = document.getElementById('emptyState');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const unmuteBtn = document.getElementById('unmuteBtn');

let localStream = null;
let peerConnections = {};
let iceCandidatesQueue = {};

const rtcConfig = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
    {
      urls: 'turn:openrelay.metered.ca:80',
      username: 'openrelay',
      credential: 'openrelay'
    },
    {
      urls: 'turn:openrelay.metered.ca:443',
      username: 'openrelay',
      credential: 'openrelay'
    },
    {
      urls: 'turn:openrelay.metered.ca:443?transport=tcp',
      username: 'openrelay',
      credential: 'openrelay'
    }
  ],
  iceCandidatePoolSize: 10
};

function setStatus(text, isLive) {
  statusText.textContent = text;
  statusDot.className = 'dot ' + (isLive ? 'live' : '');
}

function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

socket.emit('join-room', { roomId, isHost: (role === 'host') });

if (role === 'host') {
  document.getElementById('btnStream').style.display = 'inline-flex';
  document.getElementById('emptyTitle').textContent = 'Você é o Host';
  document.getElementById('emptySub').textContent = 'Clique em "Transmitir Tela" para compartilhar com áudio.';
  setStatus('Host Pronto', true);
}

async function toggleStream() {
  if (!localStream) {
    try {
      localStream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 60, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: true
      });

      video.srcObject = localStream;
      video.muted = true;
      video.style.display = 'block';
      emptyState.style.display = 'none';

      document.getElementById('btnStream').className = 'dbtn danger';
      document.getElementById('btnStream').innerHTML = '⏹️ Parar Transmissão';
      setStatus('Ao Vivo (60 FPS)', true);

      socket.emit('stream-state', { roomId, isStreaming: true });

      localStream.getVideoTracks()[0].onended = () => toggleStream();
    } catch (err) {
      alert('Aviso: Selecione uma tela ou janela para transmitir.');
    }
  } else {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
    video.style.display = 'none';
    emptyState.style.display = 'block';

    document.getElementById('btnStream').className = 'dbtn pri';
    document.getElementById('btnStream').innerHTML = '📡 Transmitir Tela';
    setStatus('Transmissão Parada', false);

    socket.emit('stream-state', { roomId, isStreaming: false });

    for (let id in peerConnections) peerConnections[id].close();
    peerConnections = {};
  }
}

socket.on('new-viewer', async (viewerId) => {
  if (!localStream) return;
  if (peerConnections[viewerId]) peerConnections[viewerId].close();

  const pc = new RTCPeerConnection(rtcConfig);
  peerConnections[viewerId] = pc;

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('signal-ice', { to: viewerId, candidate: e.candidate });
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('signal-offer', { to: viewerId, offer });
});

socket.on('signal-answer', async ({ from, answer }) => {
  const pc = peerConnections[from];
  if (pc) await pc.setRemoteDescription(new RTCSessionDescription(answer));
});

socket.on('signal-ice', async ({ from, candidate }) => {
  const pc = (role === 'host') ? peerConnections[from] : window.viewerPC;
  if (pc && pc.remoteDescription) {
    try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
  } else {
    if (!iceCandidatesQueue[from]) iceCandidatesQueue[from] = [];
    iceCandidatesQueue[from].push(candidate);
  }
});

socket.on('signal-offer', async ({ from, offer }) => {
  if (window.viewerPC) window.viewerPC.close();

  const pc = new RTCPeerConnection(rtcConfig);
  window.viewerPC = pc;

  pc.ontrack = (event) => {
    if (event.streams && event.streams[0]) {
      video.srcObject = event.streams[0];
    } else {
      if (!video.srcObject) video.srcObject = new MediaStream();
      video.srcObject.addTrack(event.track);
    }

    video.style.display = 'block';
    emptyState.style.display = 'none';
    setStatus('Ao Vivo', true);

    video.play().catch(() => {
      video.muted = true;
      video.play();
      unmuteBtn.style.display = 'block';
    });
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('signal-ice', { to: from, candidate: e.candidate });
  };

  await pc.setRemoteDescription(new RTCSessionDescription(offer));

  if (iceCandidatesQueue[from]) {
    for (const cand of iceCandidatesQueue[from]) {
      await pc.addIceCandidate(new RTCIceCandidate(cand)).catch(() => {});
    }
    delete iceCandidatesQueue[from];
  }

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit('signal-answer', { to: from, answer });
});

socket.on('stream-ready', () => {
  if (role !== 'host') {
    socket.emit('request-stream', { roomId });
  }
});

socket.on('host-left', () => {
  video.style.display = 'none';
  emptyState.style.display = 'block';
  setStatus('Host Saiu', false);
});

socket.on('room-status', (d) => {
  document.getElementById('viewerCount').textContent = d.viewers;
  if (role !== 'host' && d.isStreaming && (!video.srcObject || video.style.display === 'none')) {
    socket.emit('request-stream', { roomId });
  }
});

function enableAudio() {
  video.muted = false;
  video.volume = 1;
  document.getElementById('volSlider').value = 100;
  document.getElementById('btnMute').textContent = '🔊';
  unmuteBtn.style.display = 'none';
}

function setVolume(v) {
  video.volume = v / 100;
  video.muted = (v == 0);
  document.getElementById('btnMute').textContent = (v == 0) ? '🔇' : '🔊';
}

function toggleMute() {
  video.muted = !video.muted;
  document.getElementById('btnMute').textContent = video.muted ? '🔇' : '🔊';
}

function toggleFullscreen() {
  const stage = document.getElementById('stageArea');
  if (!document.fullscreenElement) {
    stage.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

function copyLink() {
  const url = window.location.origin + '/room/' + roomId + '?role=viewer';
  navigator.clipboard.writeText(url).then(() => showToast('📋 Link copiado com sucesso!'));
}
</script>
</body>
</html>
