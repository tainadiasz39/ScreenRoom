<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord • ScreenRoom</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
body { background:#1e1f22; color:#dbdee1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.auth-box { background:#313338; border-radius:8px; width:100%; max-width:480px; padding:32px; box-shadow:0 8px 24px rgba(0,0,0,0.5); text-align:center; }
.discord-logo { width:64px; height:64px; background:#5865f2; border-radius:20px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:2rem; }
h1 { color:#f2f3f5; font-size:1.5rem; font-weight:700; margin-bottom:6px; }
p { color:#949ba4; font-size:0.95rem; margin-bottom:24px; }
.btn { width:100%; padding:14px; border-radius:4px; font-size:0.95rem; font-weight:600; border:none; cursor:pointer; margin-bottom:10px; transition:0.15s; }
.btn-primary { background:#5865f2; color:#fff; }
.btn-primary:hover { background:#4752c4; }
.btn-secondary { background:#4e5058; color:#fff; }
.btn-secondary:hover { background:#6d6f78; }
.input-wrap { display:none; flex-direction:column; gap:8px; margin-top:16px; }
.input-wrap.active { display:flex; }
input { padding:12px; background:#1e1f22; border:1px solid #111214; border-radius:4px; color:#fff; font-size:0.95rem; outline:none; }
input:focus { border-color:#5865f2; }
</style>
</head>
<body>
<div class="auth-box">
  <div class="discord-logo">🎮</div>
  <h1>Screen Room</h1>
  <p>Transmissão de tela 60 FPS com áudio cristalino e call em grupo</p>
  <button class="btn btn-primary" onclick="createRoom()">Criar Sala</button>
  <button class="btn btn-secondary" onclick="toggleJoin()">Entrar com Link / Código</button>
  <div class="input-wrap" id="joinWrap">
    <input type="text" id="roomInput" placeholder="Código ou link da sala...">
    <button class="btn btn-primary" onclick="joinRoom()">Conectar</button>
  </div>
</div>
<script>
function createRoom() {
  fetch('/api/create-room', { method: 'POST' })
    .then(r => r.json())
    .then(d => window.location.href = '/room/' + d.roomId + '?role=host');
}
function toggleJoin() { document.getElementById('joinWrap').classList.toggle('active'); }
function joinRoom() {
  let v = document.getElementById('roomInput').value.trim().toUpperCase();
  if (!v) return alert('Digite o link ou código');
  if (v.includes('/ROOM/')) v = v.split('/ROOM/')[1].split('?')[0];
  window.location.href = '/room/' + v + '?role=viewer';
}
</script>
</body>
</html>
