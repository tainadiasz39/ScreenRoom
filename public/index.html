<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScreenRoom</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#25273c,#111214 70%);color:#f2f3f5;font-family:Arial,sans-serif}
main{width:min(760px,92vw);margin:42px auto;background:#2b2d31;border-radius:12px;padding:34px;box-shadow:0 20px 70px #0008}
h1,.subtitle{text-align:center}.subtitle,.muted{color:#b5bac1}
input,button{border:0;border-radius:5px;padding:13px;font-size:15px}
input{background:#1e1f22;color:#fff;width:100%;margin:7px 0}
button{background:#5865f2;color:#fff;font-weight:bold;cursor:pointer}
button:hover{background:#4752c4}
.create{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.divider{height:1px;background:#3f4147;margin:28px 0}
.room{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#1e1f22;border-radius:8px;padding:15px;margin:10px 0}
.room strong{display:block}.live{color:#ff6b6b;font-weight:bold}.empty{text-align:center;color:#b5bac1;padding:25px}
</style>
</head>
<body>
<main>
  <h1>🖥️ ScreenRoom</h1>
  <p class="subtitle">Crie uma sala ou peça para entrar em uma transmissão.</p>

  <h2>Criar sala</h2>

  <div class="create">
    <input id="hostName" maxlength="40" placeholder="Seu nome">
    <input id="roomName" maxlength="60" placeholder="Nome da sala">
    <button onclick="createRoom()">Criar sala</button>
  </div>

  <div class="divider"></div>

  <h2>🔴 Salas disponíveis</h2>

  <div id="rooms" class="empty">
    Nenhuma sala disponível agora.
  </div>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const rooms = document.getElementById("rooms");

function escapeHtml(value) {
  const element = document.createElement("span");
  element.textContent = value;
  return element.innerHTML;
}

function enterRoom(roomId, role, name, hostKey) {
  sessionStorage.setItem("screenroomRoom", roomId);
  sessionStorage.setItem("screenroomRole", role);
  sessionStorage.setItem("screenroomName", name);

  if (hostKey) {
    sessionStorage.setItem("screenroomHostKey", hostKey);
  }

  location.href = "/room";
}

function createRoom() {
  const hostName =
    document.getElementById("hostName").value.trim() || "Host";

  const name =
    document.getElementById("roomName").value.trim() || "Sala ao vivo";

  socket.emit("create-room", { hostName, name });
}

function askToJoin(roomId) {
  const name = prompt(
    "Como você quer aparecer para o dono da sala?",
    "Visitante"
  );

  if (name === null) return;

  enterRoom(roomId, "viewer", name.trim() || "Visitante");
}

socket.on("room-created", ({ roomId, hostKey }) => {
  const name =
    document.getElementById("hostName").value.trim() || "Host";

  enterRoom(roomId, "host", name, hostKey);
});

socket.on("rooms-updated", list => {
  if (!list.length) {
    rooms.className = "empty";
    rooms.textContent = "Nenhuma sala disponível agora.";
    return;
  }

  rooms.className = "";

  rooms.innerHTML = list.map(room => `
    <article class="room">
      <div>
        <strong>${escapeHtml(room.name)}</strong>
        <span class="muted">
          por ${escapeHtml(room.hostName)} · 👥 ${room.viewers} assistindo
        </span>
      </div>

      <div>
        <span class="${room.isStreaming ? "live" : "muted"}">
          ${room.isStreaming ? "● AO VIVO" : "Aguardando"}
        </span>

        <button onclick="askToJoin('${room.id}')">
          Pedir para entrar
        </button>
      </div>
    </article>
  `).join("");
});
</script>
</body>
</html>
